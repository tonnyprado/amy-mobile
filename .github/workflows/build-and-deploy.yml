name: Build and Deploy APK/IPA

on:
  push:
    branches:
      - main
      - production
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' || github.event.inputs.platform == ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS installation
        run: |
          eas --version
          eas whoami || echo "Not logged in with EXPO_TOKEN"

      - name: Cleanup yarn files
        run: |
          rm -f yarn.lock
          rm -f .yarnrc
          rm -f .yarnrc.yml

      - name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Download APK
        run: |
          eas build:download --platform android --latest --output=./amy-repartidor.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: amy-repartidor.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amy-repartidor-apk
          path: amy-repartidor.apk
          retention-days: 30

      - name: Generate QR Code for APK
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/amy-repartidor.apk"
          echo "APK Download URL: $DOWNLOAD_URL"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: Comment on PR with Download Link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Android APK Built Successfully\n\n' +
                    'Download: [amy-repartidor.apk](${{ env.DOWNLOAD_URL }})\n\n' +
                    'Scan QR code: https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${{ env.DOWNLOAD_URL }}'
            })

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' || github.event.inputs.platform == ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS installation
        run: |
          eas --version
          eas whoami || echo "Not logged in with EXPO_TOKEN"

      - name: Cleanup yarn files
        run: |
          rm -f yarn.lock
          rm -f .yarnrc
          rm -f .yarnrc.yml

      - name: Install dependencies
        run: npm install

      - name: Build iOS IPA (Ad-Hoc)
        run: eas build --platform ios --profile preview --non-interactive

      - name: Download IPA
        run: |
          eas build:download --platform ios --latest --output=./amy-repartidor.ipa

      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: amy-repartidor.ipa
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amy-repartidor-ipa
          path: amy-repartidor.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          eas submit --platform ios --latest --non-interactive
