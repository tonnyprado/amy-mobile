name: Build and Deploy APK/IPA

on:
  push:
    branches:
      - main
      - production
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' || github.event.inputs.platform == ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install EAS CLI with npm
        run: npm install -g eas-cli

      - name: Verify EAS installation and login
        run: |
          eas --version
          echo "Logging in with EXPO_TOKEN..."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Cleanup yarn files
        run: |
          rm -f yarn.lock
          rm -f .yarnrc
          rm -f .yarnrc.yml

      - name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          # Obtener el ID del último build exitoso
          BUILD_ID=$(eas build:list --platform=android --status=finished --non-interactive --json --limit=1 | jq -r '.[0].id')
          echo "Build ID: $BUILD_ID"

          # Descargar el APK
          eas build:download --id="$BUILD_ID"

          # Buscar el APK descargado en el directorio de cache
          CACHE_DIR="/tmp/runner/eas-cli-nodejs/eas-build-run-cache"
          APK_FILE=$(find "$CACHE_DIR" -name "*.apk" -type f 2>/dev/null | head -n 1)

          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" ./mendiola-logistics.apk
            ls -lh mendiola-logistics.apk
          else
            echo "ERROR: No APK file found in cache directory"
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mendiola-logistics.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mendiola-logistics-apk
          path: mendiola-logistics.apk
          retention-days: 30

      - name: Generate QR Code for APK
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/mendiola-logistics.apk"
          echo "APK Download URL: $DOWNLOAD_URL"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: Comment on PR with Download Link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Android APK Built Successfully\n\n' +
                    'Download: [mendiola-logistics.apk](${{ env.DOWNLOAD_URL }})\n\n' +
                    'Scan QR code: https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${{ env.DOWNLOAD_URL }}'
            })

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    # iOS deshabilitado temporalmente - requiere Apple Developer account ($99/año)
    if: false && (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' || github.event.inputs.platform == '')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install EAS CLI with npm
        run: npm install -g eas-cli

      - name: Verify EAS installation and login
        run: |
          eas --version
          echo "Logging in with EXPO_TOKEN..."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Cleanup yarn files
        run: |
          rm -f yarn.lock
          rm -f .yarnrc
          rm -f .yarnrc.yml

      - name: Install dependencies
        run: npm install

      - name: Build iOS IPA (Ad-Hoc)
        run: eas build --platform ios --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download IPA
        run: |
          # Obtener el ID del último build exitoso
          BUILD_ID=$(eas build:list --platform=ios --status=finished --non-interactive --json --limit=1 | jq -r '.[0].id')
          echo "Build ID: $BUILD_ID"

          # Descargar el IPA con flag --id
          eas build:download --id="$BUILD_ID"

          # Renombrar al IPA descargado
          mv *.ipa mendiola-logistics.ipa || echo "IPA already has correct name"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mendiola-logistics.ipa
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mendiola-logistics-ipa
          path: mendiola-logistics.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
