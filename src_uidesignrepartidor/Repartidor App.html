<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Repartidor App — Rediseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: 'Montserrat', -apple-system, system-ui, sans-serif;
    background: #ECECEC;
    color: #111;
    -webkit-font-smoothing: antialiased;
  }
  *, *::before, *::after { box-sizing: border-box; }

  .stage {
    min-height: 100vh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
    background:
      radial-gradient(circle at 20% 20%, rgba(0,0,0,0.04), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(0,0,0,0.06), transparent 50%),
      #ECECEC;
  }

  /* iOS device frame */
  .device {
    width: 390px; height: 844px; border-radius: 48px;
    overflow: hidden; position: relative;
    box-shadow: 0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12);
    font-family: 'Montserrat', -apple-system, system-ui, sans-serif;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; border-radius: 24px; background: #000; z-index: 50;
  }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 139px; height: 5px; border-radius: 100px;
    background: rgba(0,0,0,0.28); z-index: 100; pointer-events: none;
  }
  .home-indicator.dark { background: rgba(255,255,255,0.7); }
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 100;
    height: 54px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px 14px;
  }
  .status-bar .t { font-weight: 600; font-size: 16px; }
  .status-bar.dark .t, .status-bar.dark svg { color: #fff; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }

  /* Inner snap scroll */
  .snap {
    position: absolute; inset: 0;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .snap::-webkit-scrollbar { display: none; }
  .snap { scrollbar-width: none; }
  .snap > section { scroll-snap-align: start; scroll-snap-stop: always; }

  /* Side rail */
  .rail {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    z-index: 70; display: flex; flex-direction: column; gap: 10px;
    align-items: center;
  }
  .rail button {
    width: 22px; height: 22px; padding: 0; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
  }
  .rail .dot {
    width: 6px; height: 6px; border-radius: 4px;
    background: rgba(0,0,0,0.28); transition: all 0.25s ease;
  }
  .rail.dark .dot { background: rgba(0,0,0,0.45); }
  .rail .dot.active { height: 22px; background: #0F0F0F; }
  .rail.dark .dot.active { background: #0F0F0F; }
  .rail .label {
    position: absolute; right: 26px; top: 50%; transform: translateY(-50%);
    background: #0F0F0F; color: #fff; padding: 4px 8px; border-radius: 6px;
    font-size: 10px; font-family: 'Manrope', sans-serif;
    letter-spacing: 0.6px; text-transform: uppercase;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.15s;
  }
  .rail button:hover .label { opacity: 1; }

  /* hide horizontal scrollbar on chips */
  .chips::-webkit-scrollbar { display: none; }
  .chips { scrollbar-width: none; }

  /* Floating Chat FAB */
  .chat-fab {
    position: absolute; right: 18px; bottom: 54px; z-index: 80;
    width: 58px; height: 58px; border-radius: 20px;
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
  }
  .chat-fab:hover { transform: scale(1.04); }
  .chat-fab:active { transform: scale(0.96); }
  .chat-fab .badge {
    position: absolute; top: -5px; right: -5px;
    min-width: 22px; height: 22px; padding: 0 6px;
    border-radius: 11px;
    font-size: 11px; font-weight: 800;
    font-family: 'Manrope', sans-serif; font-feature-settings: 'tnum';
    display: flex; align-items: center; justify-content: center;
    border: 2.5px solid;
  }
  .chat-fab .pulse {
    position: absolute; inset: 0; border-radius: 20px;
    pointer-events: none;
    animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0    var(--pulse-color, rgba(255,120,73,0.55)); }
    70%  { box-shadow: 0 0 0 16px transparent; }
    100% { box-shadow: 0 0 0 0    transparent; }
  }

  /* Incoming notification toast */
  .toast {
    position: absolute; top: 64px; left: 14px; right: 14px;
    z-index: 110;
    background: #0F0F0F; color: #fff;
    border-radius: 18px; padding: 12px 14px 12px 12px;
    display: flex; gap: 12px; align-items: center;
    box-shadow: 0 18px 40px rgba(0,0,0,0.32);
    transform: translateY(-140%);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s;
    cursor: pointer;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast .avatar {
    width: 38px; height: 38px; border-radius: 19px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; color: #0F0F0F;
    flex-shrink: 0;
  }
  .toast .name { font-size: 13px; font-weight: 700; letter-spacing: -0.2px;
                 display: flex; align-items: center; gap: 6px; }
  .toast .msg  { font-size: 12px; opacity: 0.7; margin-top: 1px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                 max-width: 220px; }
  .toast .time { font-size: 10px; color: rgba(255,255,255,0.45);
                 font-family: 'Manrope', sans-serif; font-feature-settings: 'tnum';
                 flex-shrink: 0; margin-left: auto; }

  /* Chat drawer */
  .drawer-scrim {
    position: absolute; inset: 0; z-index: 85;
    background: rgba(0,0,0,0.32);
    backdrop-filter: blur(2px);
    opacity: 0;
    transition: opacity 0.28s ease;
    pointer-events: none;
  }
  .drawer-scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 100%; z-index: 90;
    background: #F4F4EF;
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: -12px 0 40px rgba(0,0,0,0.18);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .drawer.open { transform: translateX(0%); }
  .drawer.dragging { transition: none; }
  .drawer-handle {
    position: absolute; top: 50%; left: 6px; transform: translateY(-50%);
    width: 4px; height: 38px; border-radius: 4px;
    background: rgba(0,0,0,0.12); z-index: 1;
  }

  /* Circle reveal when opening a conversation */
  .reveal-circle {
    position: absolute; inset: 0; z-index: 50;
    pointer-events: none;
    will-change: clip-path, opacity;
    animation: reveal-expand 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes reveal-expand {
    0%   { clip-path: circle(0%   at var(--rx) var(--ry)); opacity: 1; }
    55%  { clip-path: circle(110% at var(--rx) var(--ry)); opacity: 1; }
    100% { clip-path: circle(140% at var(--rx) var(--ry)); opacity: 0; }
  }

  /* Typing indicator dots */
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0);   opacity: 0.4; }
    30%           { transform: translateY(-4px); opacity: 1;   }
  }

  /* Tweaks bare-bones (no external) */
  .tw-panel {
    position: fixed; right: 16px; bottom: 16px; z-index: 100;
    background: rgba(255,255,255,0.96); backdrop-filter: blur(12px);
    border: 1px solid rgba(0,0,0,0.08); border-radius: 16px;
    padding: 14px 14px 12px; width: 280px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    font-family: 'Montserrat', sans-serif;
  }
  .tw-panel h4 {
    margin: 0 0 10px; font-size: 11px; font-family: 'Manrope', sans-serif;
    letter-spacing: 1.2px; text-transform: uppercase; color: #555;
  }
  .tw-row { margin-bottom: 12px; }
  .tw-row > label {
    font-size: 11px; font-family: 'Manrope', sans-serif;
    letter-spacing: 0.6px; text-transform: uppercase; color: #666;
    display: block; margin-bottom: 6px;
  }
  .tw-swatches { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
  .tw-swatches button {
    border: 1px solid rgba(0,0,0,0.08); border-radius: 8px;
    background: #fff; padding: 4px; cursor: pointer;
    display: flex; flex-direction: column; gap: 3px; align-items: center;
    transition: all 0.12s;
  }
  .tw-swatches button.active { border-color: #111; box-shadow: 0 0 0 1px #111; }
  .tw-swatches .row { display: flex; width: 100%; height: 22px; border-radius: 5px; overflow: hidden; }
  .tw-swatches .row div { flex: 1; }
  .tw-swatches .row div:first-child { flex: 2; }
  .tw-swatches span { font-size: 9px; color: #444; font-family: 'Manrope', sans-serif; }
  .tw-select {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid rgba(0,0,0,0.1); background: #fff;
    font-family: 'Montserrat', sans-serif; font-size: 13px; color: #111;
  }
  .tw-toggle {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: #333; padding: 4px 0;
  }
  .tw-toggle .sw {
    width: 36px; height: 20px; border-radius: 12px; background: #ccc;
    position: relative; transition: background 0.15s; cursor: pointer;
  }
  .tw-toggle .sw::after {
    content: ''; position: absolute; left: 2px; top: 2px;
    width: 16px; height: 16px; border-radius: 8px; background: #fff;
    transition: left 0.15s;
  }
  .tw-toggle.on .sw { background: #0F0F0F; }
  .tw-toggle.on .sw::after { left: 18px; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <script type="text/babel" data-presets="env,react">
  (function(){
    const { useState, useEffect, useRef, useMemo } = React;

    // ─────────────────────────────────────────────────────────
    // Icon wrapper around lucide
    // ─────────────────────────────────────────────────────────
    function Icon({ name, size = 18, strokeWidth = 2, color, style }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!ref.current || !window.lucide) return;
        const data = window.lucide.icons?.[name] || window.lucide[toPascal(name)];
        if (!data) { ref.current.innerHTML = ''; return; }
        // lucide.icons[name] is array [tag, attrs, children]
        const node = Array.isArray(data) ? data : (data.iconNode || data);
        const svg = nodeToSvg(node, { size, strokeWidth, color });
        ref.current.innerHTML = svg;
      }, [name, size, strokeWidth, color]);
      return <span ref={ref} style={{
        display: 'inline-flex', width: size, height: size,
        alignItems: 'center', justifyContent: 'center',
        color: color || 'currentColor', ...style,
      }} />;
    }
    function toPascal(n){ return n.split('-').map(s => s[0].toUpperCase()+s.slice(1)).join(''); }
    function nodeToSvg(node, { size, strokeWidth, color }) {
      // node may be [tag, attrs, children] OR [[tag, attrs], ...]
      let children = '';
      if (Array.isArray(node[0]) || typeof node[0] === 'object') {
        children = node.map(c => oneTag(c)).join('');
      } else if (typeof node[2] !== 'undefined' && Array.isArray(node[2])) {
        children = node[2].map(c => oneTag(c)).join('');
      } else {
        // fallback unknown
        children = '';
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color || 'currentColor'}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round">${children}</svg>`;
    }
    function oneTag(c) {
      if (!Array.isArray(c)) return '';
      const [tag, attrs] = c;
      const a = Object.entries(attrs || {}).map(([k,v]) => `${k}="${v}"`).join(' ');
      return `<${tag} ${a} />`;
    }

    // ─────────────────────────────────────────────────────────
    // Tweaks (super-light, in-page only)
    // ─────────────────────────────────────────────────────────
    function useTweaks(defaults) {
      const [v, setV] = useState(defaults);
      const set = (k, val) => setV(s => ({ ...s, [k]: val }));
      return [v, set];
    }

    // ─────────────────────────────────────────────────────────
    // Status bar (custom — full control)
    // ─────────────────────────────────────────────────────────
    function StatusBar({ dark, color }) {
      const c = color || (dark ? '#fff' : '#000');
      return (
        <div className={`status-bar ${dark ? 'dark' : ''}`} style={{ color: c }}>
          <span className="t" style={{ color: c }}>9:41</span>
          <div className="icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill={c}>
              <rect x="0" y="7.5" width="3" height="4.5" rx="0.6"/>
              <rect x="4.5" y="5" width="3" height="7" rx="0.6"/>
              <rect x="9" y="2.5" width="3" height="9.5" rx="0.6"/>
              <rect x="13.5" y="0" width="3" height="12" rx="0.6"/>
            </svg>
            <svg width="16" height="12" viewBox="0 0 17 12" fill={c}>
              <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z"/>
              <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z"/>
              <circle cx="8.5" cy="10.5" r="1.5"/>
            </svg>
            <svg width="25" height="12" viewBox="0 0 27 13">
              <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.45" fill="none"/>
              <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
              <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.5"/>
            </svg>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // Shared atoms
    // ─────────────────────────────────────────────────────────
    const Pill = ({ children, bg, color, style }) => (
      <span style={{
        display: 'inline-flex', alignItems: 'center', gap: 5,
        padding: '4px 10px', borderRadius: 999,
        fontSize: 10, fontWeight: 700, letterSpacing: 0.4,
        background: bg, color: color, textTransform: 'uppercase',
        fontFamily: "'Manrope', sans-serif",
        ...style,
      }}>{children}</span>
    );

    const PkgPlaceholder = ({ tone = 'a', size = 64, label }) => {
      const palettes = {
        a: ['#FFCE3B', '#1A1A1A'],
        b: ['#FF7A45', '#1A1A1A'],
        c: ['#3D6BFF', '#FFFFFF'],
        d: ['#1A1A1A', '#FFFFFF'],
      };
      const [bg, fg] = palettes[tone];
      return (
        <div style={{
          width: size, height: size, borderRadius: 10,
          background: bg, color: fg,
          position: 'relative', overflow: 'hidden',
          boxShadow: '0 6px 14px rgba(0,0,0,0.16), inset 0 0 0 1px rgba(0,0,0,0.06)',
          display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
          padding: 7, boxSizing: 'border-box',
          fontFamily: "'Manrope', sans-serif",
          transform: 'rotate(-4deg)', flexShrink: 0,
        }}>
          <div style={{ fontSize: 8, opacity: 0.8, letterSpacing: 0.4 }}>FRAGILE</div>
          <div style={{ fontSize: 12, fontWeight: 700, lineHeight: 1 }}>{label}</div>
          <div style={{
            position: 'absolute', bottom: 7, left: 7, right: 7,
            height: 8, background: `repeating-linear-gradient(90deg, ${fg} 0 1.5px, transparent 1.5px 3px)`,
            opacity: 0.7,
          }} />
        </div>
      );
    };

    const iconBtn = (theme, accent) => ({
      width: 38, height: 38, borderRadius: 12,
      background: accent ? theme.ink : theme.surface,
      border: accent ? 'none' : `1px solid ${theme.border}`,
      color: accent ? theme.canvas : theme.ink,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      cursor: 'pointer',
      boxShadow: accent ? '0 6px 14px rgba(0,0,0,0.18)' : '0 1px 3px rgba(0,0,0,0.05)',
    });

    const SectionShell = ({ children, bg, label, theme, padded = true }) => (
      <section
        data-screen-label={label}
        style={{
          minHeight: '100%', height: '100%', width: '100%',
          background: bg, color: theme.ink, position: 'relative',
          display: 'flex', flexDirection: 'column',
          paddingTop: padded ? 56 : 0,
          paddingBottom: 30,
          overflow: 'hidden',
        }}
      >{children}</section>
    );

    const SectionHeader = ({ kicker, title, sub, theme, right, dark }) => (
      <div style={{
        padding: '6px 20px 0',
        display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between',
        gap: 12,
      }}>
        <div>
          <div style={{
            fontSize: 10.5, fontFamily: "'Manrope', sans-serif",
            letterSpacing: 1.4, color: dark ? 'rgba(255,255,255,0.5)' : theme.muted,
            textTransform: 'uppercase',
          }}>{kicker}</div>
          <div style={{
            fontSize: 28, fontWeight: 700, letterSpacing: -0.8,
            lineHeight: 1.05, marginTop: 2,
            color: dark ? theme.canvas : theme.ink,
          }}>{title}</div>
          {sub && <div style={{
            fontSize: 12.5, color: dark ? 'rgba(255,255,255,0.7)' : theme.muted,
            marginTop: 4, maxWidth: 280,
          }}>{sub}</div>}
        </div>
        {right}
      </div>
    );

    // ─────────────────────────────────────────────────────────
    // Map SVG (generated, no copyrighted tiles)
    // ─────────────────────────────────────────────────────────
    const MapSVG = ({ accent, muted, bg }) => (
      <svg viewBox="0 0 390 844" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style={{ display: 'block' }}>
        <defs>
          <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
            <path d="M22 0H0V22" fill="none" stroke={muted} strokeWidth="0.5" opacity="0.4"/>
          </pattern>
        </defs>
        <rect width="390" height="844" fill={bg}/>
        <rect width="390" height="844" fill="url(#grid)"/>
        <g stroke={muted} strokeWidth="14" fill="none" strokeLinecap="round" opacity="0.5">
          <path d="M-20 220 Q150 200 230 280 T 440 320"/>
          <path d="M 60 -20 Q 80 200 200 380 T 280 700"/>
          <path d="M 0 600 Q 200 580 300 640 T 440 700"/>
          <path d="M 320 0 L 240 220 L 380 460"/>
        </g>
        <g stroke={muted} strokeWidth="5" fill="none" strokeLinecap="round" opacity="0.55">
          <path d="M-20 130 L 200 120 L 410 180"/>
          <path d="M 100 280 L 180 460 L 100 620"/>
          <path d="M 240 380 L 360 480"/>
          <path d="M 60 760 L 380 820"/>
        </g>
        {/* Active route */}
        <path d="M 90 780 Q 140 680 130 580 Q 120 460 200 380 Q 270 300 250 220 Q 230 140 130 110"
              stroke={accent} strokeWidth="6" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        {/* Future segment dashed */}
        <path d="M 130 110 Q 220 70 320 90"
              stroke={accent} strokeWidth="6" fill="none" strokeLinecap="round" strokeDasharray="2 8" opacity="0.55"/>
        {/* Pickup pin */}
        <g transform="translate(130 110)">
          <circle r="14" fill="#1a1a1a"/>
          <circle r="6" fill={accent}/>
        </g>
        {/* Current vehicle */}
        <g transform="translate(200 380)">
          <circle r="20" fill="#fff" stroke="#1a1a1a" strokeWidth="2"/>
          <path d="M-6 4 L0 -8 L6 4 L0 1 Z" fill="#1a1a1a"/>
        </g>
        {/* Destination pin */}
        <g transform="translate(90 780)">
          <circle r="11" fill={accent}/>
          <circle r="4" fill="#1a1a1a"/>
        </g>
      </svg>
    );

    // ─────────────────────────────────────────────────────────
    // SECTION 1 — Map
    // ─────────────────────────────────────────────────────────
    function MapSection({ theme }) {
      const stops = [
        { id: '1', s: 'done' }, { id: '2', s: 'done' },
        { id: '3', s: 'current' }, { id: '4', s: 'next' }, { id: '5', s: 'next' },
      ];
      return (
        <SectionShell bg={theme.canvas} label="01 Mapa" theme={theme}>
          {/* Map area */}
          <div style={{ position: 'absolute', inset: 0, background: theme.mapBg, zIndex: 0 }}>
            <MapSVG accent={theme.accent} muted={theme.mapLine} bg={theme.mapBg} />
          </div>

          {/* Header overlay */}
          <div style={{

    // ─────────────────────────────────────────────────────────

    const PALETTES = {

        accent: '#FF7849', accentInk: '#1A1110',
        mapBg: '#F0EBE6', mapLine: '#D2CBC3',

        successFg: '#0B7E3E', successBg: '#DDF1E1',

      blue: {

        ink: '#0C1A2E', muted: '#5C6A82',
        accent: '#3D6BFF', accentInk: '#FFFFFF',
        mapBg: '#E8ECF2', mapLine: '#C2CADA',
        successFg: '#0B7E3E', successBg: '#DDF1E1',
        warnBg: '#FFE3A8', warnBorder: '#F0C45C',
      },
    };

    const PALETTE_SWATCHES = {
      lime:   ['#B8FF3C','#0F0F0F','#F4F4EF'],
      coral:  ['#FF7849','#1A1110','#F8F4F0'],
      violet: ['#C5B4FF','#171327','#F5F3FA'],
      blue:   ['#3D6BFF','#0C1A2E','#F1F4F8'],
    };

    // ─────────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────────
    function App() {
      const [t, setTweak] = useTweaks({
        palette: 'coral',
        showRail: true,
        section: 0,
      });
      const theme = PALETTES[t.palette] || PALETTES.lime;

      const sections = [
        { id: 'mapa',  Comp: MapSection,    label: 'Mapa',         bg: theme.canvas, accent: false },
        { id: 'hoy',   Comp: OrdersSection, label: 'Pedidos',      bg: theme.canvas, accent: false },
        { id: 'stats', Comp: StatsSection,  label: 'Estadísticas', bg: theme.accent, accent: true  },
      ];

      // Chat drawer state + swipe handling
      const [chatOpen, setChatOpen] = useState(false);
      const [openConvId, setOpenConvId] = useState(null);
      const [reveal, setReveal] = useState(null); // { color, x, y } for circle reveal
      const [unreadByConv, setUnreadByConv] = useState({ tony: 2 });
      const [toast, setToast] = useState(null);  // { name, tag, color, message, convId, shown }
      const toastTimerRef = useRef(null);
      const dismissToast = () => {
        setToast(null);
        if (toastTimerRef.current) {
          clearTimeout(toastTimerRef.current);
          toastTimerRef.current = null;
        }
      };
      const unreadCount = Object.values(unreadByConv).reduce((a,b) => a+b, 0);

      // Demo: simulate an incoming message a few seconds after load while chat is closed
      useEffect(() => {
        const fire = (payload, delay) => setTimeout(() => {
          if (chatOpen) return;
          setUnreadByConv(s => ({ ...s, [payload.convId]: (s[payload.convId] || 0) + 1 }));
          setToast({ ...payload, shown: false });
          // next frame: trigger CSS transition by flipping `shown`
          requestAnimationFrame(() => requestAnimationFrame(() => {
            setToast(t => t ? { ...t, shown: true } : null);
          }));
          // auto-dismiss after 5s
          toastTimerRef.current = setTimeout(() => {
            setToast(t => t ? { ...t, shown: false } : null);
            setTimeout(() => setToast(null), 400);
          }, 5000);
        }, delay);

        const ids = [
          fire({ convId: 'tony', name: 'Tony Prado', tag: 'TP', color: theme.accent,
                 message: 'Recuerda mandar reporte al llegar.' }, 4500),
        ];
        return () => ids.forEach(clearTimeout);
        // eslint-disable-next-line
      }, []);

      // When chat opens, clear unread for the active conversation
      useEffect(() => {
        if (chatOpen && openConvId) {
          setUnreadByConv(s => ({ ...s, [openConvId]: 0 }));
        }
      }, [chatOpen, openConvId]);

      const [dragX, setDragX] = useState(null);
      const drawerRef = useRef(null);
      const dragStart = useRef(null);

      const onTouchStart = (e) => {
        // ignore if user is interacting with a scrollable child horizontally
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        dragStart.current = { x, y, openAtStart: chatOpen, decided: false, horizontal: false };
      };
      const onTouchMove = (e) => {
        if (!dragStart.current) return;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        const dx = x - dragStart.current.x;
        const dy = y - dragStart.current.y;
        if (!dragStart.current.decided) {
          // need a small threshold before deciding gesture direction
          if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
          dragStart.current.decided = true;
          dragStart.current.horizontal = Math.abs(dx) > Math.abs(dy) * 1.1;
        }
        if (!dragStart.current.horizontal) return;
        setDragX(dx);
      };
      const onTouchEnd = (e) => {
        if (!dragStart.current) return;
        const dx = dragX || 0;
        const w = 390;
        const openAtStart = dragStart.current.openAtStart;
        // If closed → open by swiping left (dx < -60)
        // If open  → close by swiping right (dx > 80)
        if (!openAtStart && dx < -60) setChatOpen(true);
        else if (openAtStart && dx > 80) setChatOpen(false);
        dragStart.current = null;
        setDragX(null);
      };

      // Compute live transform for the drawer
      const drawerTransform = useMemo(() => {
        if (dragX === null) return chatOpen ? 'translateX(0%)' : 'translateX(100%)';
        const w = 390;
        if (chatOpen) {
          // open, dragging right closes; clamp 0..w
          const x = Math.max(0, Math.min(w, dragX));
          return `translateX(${x}px)`;
        } else {
          // closed, dragging left opens; clamp -w..0
          const x = Math.max(-w, Math.min(0, dragX));
          return `translateX(${w + x}px)`;
        }
      }, [dragX, chatOpen]);

      const scrimOpacity = useMemo(() => {
        if (dragX === null) return chatOpen ? 1 : 0;
        const w = 390;
        if (chatOpen) {
          const x = Math.max(0, Math.min(w, dragX));
          return 1 - (x / w);
        } else {
          const x = Math.max(-w, Math.min(0, dragX));
          return -x / w;
        }
      }, [dragX, chatOpen]);

      const scrollRef = useRef(null);
      const [activeSection, setActiveSection] = useState(0);

      useEffect(() => {
        const root = scrollRef.current;
        if (!root) return;
        const els = root.querySelectorAll('section[data-screen-label]');
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting && e.intersectionRatio > 0.55) {
              const i = [...els].indexOf(e.target);
              if (i >= 0) setActiveSection(i);
            }
          });
        }, { root, threshold: [0.55, 0.7] });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      }, []);

      const goTo = (i) => {
        const root = scrollRef.current;
        if (!root) return;
        const els = root.querySelectorAll('section[data-screen-label]');
        els[i]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setActiveSection(i);
      };

      useEffect(() => { goTo(t.section); }, [t.section]);

      const railOnAccent = activeSection === 2;
      const statusDark = false;
      // Status bar text color adapts: dark text on light bg, dark on accent (it's high-contrast)

      return (
        <div className="stage">
          <div
            className="device"
            style={{ background: theme.canvas, ['--accent']: theme.accent }}
            onPointerDown={onTouchStart}
            onPointerMove={onTouchMove}
            onPointerUp={onTouchEnd}
            onPointerCancel={onTouchEnd}
            onTouchStart={onTouchStart}
            onTouchMove={onTouchMove}
            onTouchEnd={onTouchEnd}
          >
            <div className="island"/>
            <div ref={scrollRef} className="snap">
              {sections.map(s => (
                <s.Comp key={s.id} theme={theme} />
              ))}
            </div>
            <StatusBar dark={statusDark} color={theme.ink}/>

            {/* Floating Chat FAB — always visible */}
            {(() => {
              const onAccentBg = activeSection === 2;
              const fabBg   = onAccentBg ? theme.ink : theme.accent;
              const fabFg   = onAccentBg ? theme.canvas : theme.ink;
              const badgeBg = onAccentBg ? theme.accent : theme.ink;
              const badgeFg = onAccentBg ? theme.ink : theme.canvas;
              const pulseRgba = onAccentBg
                ? 'rgba(15,15,15,0.45)'
                : (theme.pulse || 'rgba(255,120,73,0.55)');
              return (
                <button
                  className="chat-fab"
                  onClick={() => { setChatOpen(true); setOpenConvId(null); dismissToast(); }}
                  aria-label="Abrir chat"
                  style={{
                    background: fabBg, color: fabFg,
                    boxShadow: `0 14px 32px ${onAccentBg ? 'rgba(0,0,0,0.32)' : 'rgba(0,0,0,0.18)'}, 0 0 0 1px rgba(0,0,0,0.06) inset`,
                    opacity: chatOpen ? 0 : 1,
                    pointerEvents: chatOpen ? 'none' : 'auto',
                    ['--pulse-color']: pulseRgba,
                  }}
                >
                  <Icon name="message-circle" size={24} strokeWidth={2.2}/>
                  {unreadCount > 0 && (
                    <span className="badge" style={{ background: badgeBg, color: badgeFg, borderColor: fabBg }}>
                      {unreadCount}
                    </span>
                  )}
                  <span className="pulse"/>
                </button>
              );
            })()}

            {/* Incoming notification toast */}
            {toast && (
              <div
                className={`toast ${toast.shown ? 'show' : ''}`}
                onClick={() => {
                  setChatOpen(true);
                  setOpenConvId(toast.convId);
                  dismissToast();
                }}
              >
                <div className="avatar" style={{ background: toast.color }}>{toast.tag}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="name">
                    {toast.name}
                    <span style={{
                      width: 6, height: 6, borderRadius: 4, background: theme.accent,
                    }}/>
                  </div>
                  <div className="msg">{toast.message}</div>
                </div>
                <div className="time">ahora</div>
              </div>
            )}

            {t.showRail && (
              <div
                className={`rail ${railOnAccent ? 'dark' : ''}`}
                style={{ opacity: chatOpen ? 0 : 1, transition: 'opacity 0.2s', pointerEvents: chatOpen ? 'none' : 'auto' }}
              >
                {sections.map((s, i) => (
                  <button key={s.id} onClick={() => goTo(i)} aria-label={s.label}>
                    <span className={`dot ${activeSection === i ? 'active' : ''}`}/>
                    <span className="label">{s.label}</span>
                  </button>
                ))}
              </div>
            )}

            {/* Scrim */}
            <div
              className={`drawer-scrim ${chatOpen ? 'open' : ''}`}
              style={{ opacity: scrimOpacity, pointerEvents: chatOpen ? 'auto' : 'none' }}
              onClick={() => setChatOpen(false)}
            />

            {/* Chat drawer */}
            <div
              ref={drawerRef}
              className={`drawer ${dragX !== null ? 'dragging' : ''} ${chatOpen ? 'open' : ''}`}
              style={{ background: theme.canvas, transform: drawerTransform }}
            >
              <div className="drawer-handle"/>
              <ChatSection
                theme={theme}
                onClose={() => { setChatOpen(false); setOpenConvId(null); setReveal(null); }}
                openConvId={openConvId}
                onOpenConv={(conv, ev) => {
                  const dRect = drawerRef.current?.getBoundingClientRect();
                  const r = ev.currentTarget.getBoundingClientRect();
                  const x = dRect ? r.left + r.width/2 - dRect.left : 195;
                  const y = dRect ? r.top  + r.height/2 - dRect.top : 200;
                  setReveal({ color: conv.color, x, y, ts: Date.now() });
                  // open conversation after the reveal expansion has begun
                  setTimeout(() => setOpenConvId(conv.id), 80);
                  // unread for that conv → 0
                  setUnreadByConv(s => ({ ...s, [conv.id]: 0 }));
                  // clear reveal overlay after animation
                  setTimeout(() => setReveal(null), 800);
                }}
                onBackToList={() => setOpenConvId(null)}
                reveal={reveal}
                unreadByConv={unreadByConv}
              />
            </div>

            <div className="home-indicator"/>
          </div>

          <TweaksPanel
            t={t}
            setTweak={setTweak}
            sections={sections}
            activeSection={activeSection}
          />
        </div>
      );
    }

    function TweaksPanel({ t, setTweak, sections, activeSection }) {
      const [show, setShow] = useState(false);
      const [available, setAvailable] = useState(false);

      useEffect(() => {
        const onMsg = (e) => {
          if (e.data?.type === '__activate_edit_mode') setShow(true);
          if (e.data?.type === '__deactivate_edit_mode') setShow(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({type: '__edit_mode_available'}, '*');
        setAvailable(true);
        return () => window.removeEventListener('message', onMsg);
      }, []);

      // Sync select with currently visible section
      useEffect(() => {
        if (t.section !== activeSection) setTweak('section', activeSection);
        // eslint-disable-next-line
      }, [activeSection]);

      if (!show) return null;
      return (
        <div className="tw-panel">
          <h4>Tweaks</h4>
          <div className="tw-row">
            <label>Paleta</label>
            <div className="tw-swatches">
              {Object.entries(PALETTE_SWATCHES).map(([k, sw]) => (
                <button key={k} className={t.palette === k ? 'active' : ''}
                        onClick={() => setTweak('palette', k)}>
                  <div className="row">
                    {sw.map((c, i) => <div key={i} style={{ background: c }}/>)}
                  </div>
                  <span>{k}</span>
                </button>
              ))}
            </div>
          </div>

          <div className="tw-row">
            <label>Sección</label>
            <select className="tw-select" value={t.section}
                    onChange={(e) => setTweak('section', Number(e.target.value))}>
              {sections.map((s, i) => (
                <option key={s.id} value={i}>{`0${i+1} — ${s.label}`}</option>
              ))}
            </select>
          </div>

          <div className={`tw-toggle ${t.showRail ? 'on' : ''}`}
               onClick={() => setTweak('showRail', !t.showRail)}>
            <span>Indicador lateral</span>
            <span className="sw"/>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  })();
  </script>
</body>
</html>
